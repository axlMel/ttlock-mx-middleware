version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: gtlock-local-db
    environment:
      POSTGRES_USER: gtlock_dev
      POSTGRES_PASSWORD: gtlock_dev
      POSTGRES_DB: atagps_local
    ports:
      - "5433:5432"
    volumes:
      - ./local-db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - gtlock_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gtlock-local-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - gtlock_redis_data:/data

volumes:
  gtlock_pg_data:
  gtlock_redis_data:
