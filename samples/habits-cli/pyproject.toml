[project]
name = "habits-cli"
version = "0.1.0"
description = "Registra hábitos de estudio y calcula rachas desde la terminal."
requires-python = ">=3.12"
dependencies = []          # constitución nº 1: solo biblioteca estándar

[project.scripts]
habits = "habits.cli:main" # permite escribir `habits add ...` en vez de `python -m habits`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["habits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
